# EXPERIMENT-LEDGER — repository identity and validation foundation

site_name: Experiment Ledger
site_description: Architecture and repository foundation for a planned local experiment registry
strict: true
site_dir: .tool-cache/site
exclude_docs: |
  /internal/
theme:
  name: material
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo.png
nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Validation tooling: validation-tooling.md
  - Threat model: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_signature_annotations: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
