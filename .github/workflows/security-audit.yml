name: Source and dependency checks
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-audit:
    name: Source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LINK_MODE: hardlink
      UV_CACHE_DIR: ${{ github.workspace }}/.tool-cache/uv
      PRE_COMMIT_HOME: ${{ github.workspace }}/.tool-cache/pre-commit
    steps:
      - name: Read source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python toolchain
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.16'
      - name: Verify environment installer
        run: python -S tools/bootstrap_native_tools.py --root . --only uv --download --json
      - name: Install exact development graph
        run: |
          mkdir -p .tool-cache/tmp
          .tool-cache/native/uv/uv venv --python 3.13.16 --no-python-downloads .venv
          .tool-cache/native/uv/uv pip sync --python .venv/bin/python --require-hashes --build-constraints requirements-dev.txt --link-mode hardlink requirements-dev.txt
          make native-tools
      - name: Source and dependency checks
        run: |
          make source-audit
