name: Python source analysis
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-analysis:
    name: Python analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Initialise Python analysis
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          languages: python
          build-mode: none
          tools: linked
          ram: 2048
          threads: 1
      - name: Analyse without publishing
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          upload: never
          upload-database: false
          output: .tool-cache/codeql-results
